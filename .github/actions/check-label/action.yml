name: "Check PR labels"
description: "Checks if specific labels are present on a PR and sets outputs accordingly."

inputs:
  label:
    description: "The label to check for"
    required: true
  skip-message:
    description: "The message to display when skipping due to label"
    required: true

outputs:
  skip:
    description: "Whether to skip the tests (true/false)"
    value: ${{ steps.check.outputs.skip }}

runs:
  using: "composite"
  steps:
    - name: Check for label
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.label }}
        SKIP_MESSAGE: ${{ inputs.skip-message }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # Labels as seen in the event payload. This is a snapshot taken when
        # the workflow was triggered and is only used as a fallback.
        EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        # The event payload only reflects the labels that were present when
        # the workflow was triggered. A label added afterwards (e.g. to
        # auto-pass a check on an already running or re-run job) would never
        # be seen. Query the API for the current label set instead so that
        # re-running a job picks up labels added after the run kicked off.
        labels="${EVENT_LABELS:-[]}"
        if [[ -n "$PR_NUMBER" ]]; then
          if live=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels?per_page=100" \
            --jq '[.[].name]'); then
            labels="$live"
          else
            echo "::warning::Failed to fetch live labels for PR #${PR_NUMBER}, falling back to the event payload"
          fi
        fi

        echo "Labels on PR #${PR_NUMBER:-<none>}: ${labels}"

        if jq -e --arg l "$LABEL" 'index($l) != null' <<< "$labels" >/dev/null; then
          echo "::notice::${SKIP_MESSAGE}"
          echo "${SKIP_MESSAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
