name: CI

on:
  pull_request:
    branches:
      - "*"
    # Ready events reuse shared checks only after verifying a successful code
    # draft on this head. Missing evidence runs the normal ready selection.
    # Distinct "Prior result: " names keep earlier real outcomes intact.
    # Recover shared checks by rerunning individual jobs, never all jobs of
    # an old draft run: its race/build notices could hide ready-run failures.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    branches:
      - "master"

permissions:
  # Required to manage and delete caches.
  actions: write
  # Default permission for checking out code.
  contents: read
  # Required to read the current PR labels via the API in check-label.
  pull-requests: read

concurrency:
  # Let a running draft finish before verifying its results. A replaced
  # pending draft fails verification and runs fresh checks on the ready event.
  # Other events still cancel superseded work in this same group.
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' }}

defaults:
  run:
    shell: bash

env:
  # Accepts either a major image tag like "30" or a patch tag like "29.1".
  BITCOIN_VERSION: "31"
  
  # TRANCHES defines the number of tranches used in the itests.
  TRANCHES: 16

  # SMALL_TRANCHES defines the number of tranches used in the less stable itest
  # builds
  #
  # TODO(yy): remove this value and use TRANCHES.
  SMALL_TRANCHES: 8

  # If you change this please also update GO_VERSION in Makefile (then run
  # `make lint` to see where else it needs to be updated as well).
  GO_VERSION: 1.27.3

jobs:
  ########################
  # CI gate: detect documentation-only changes
  ########################
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    outputs:
      # True when the PR only touches files under docs/ or markdown files.
      # Push and merge_group runs never set this.
      docs-only: ${{ steps.docs-only.outputs.docs-only }}
      # Enforce replacement coverage before omitting normal SQL tests.
      sql-race-required: ${{ steps.sql-race-required.outputs.sql-race-required }}
      # Reuse only completed, successful draft checks for this PR head.
      reuse-shared: ${{ steps.reuse-shared.outputs.reuse-shared }}
    steps:
      # Anything that isn't under docs/ or a markdown file counts as code and
      # runs full CI. Renamed files are checked under both their old and new
      # name so that moving a source file into docs/ doesn't count as a
      # documentation change. An empty or failed file listing is treated as
      # "not docs only".
      #
      # Jobs consuming this output either skip at the job level (non-matrix
      # jobs) or keep the job instantiated and skip its steps (matrix jobs).
      # The latter is needed because a job-level condition is evaluated
      # before the matrix is expanded, so a skipped matrix job would never
      # report the per-leg check names that branch protection requires.
      # Record the triggering PR in existing step metadata for safe reuse.
      # Run associations may include other PRs sharing this head branch.
      - name: >-
          Detect documentation-only changes
          (PR ${{ github.event.pull_request.number }})
        id: docs-only
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # One entry per changed file: new name, tab, old name (empty
          # unless renamed). On any API failure the listing is empty.
          entries=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' \
            2>/dev/null) || entries=""

          # The files endpoint returns at most 3000 entries. Cross-check the
          # number of listed files against the PR's own count so that a
          # truncated listing can never hide a code change.
          expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.changed_files' 2>/dev/null) || expected="unknown"
          listed=$(grep -c . <<< "$entries" || true)

          # Both names of a renamed file are checked.
          files=$(tr '\t' '\n' <<< "$entries" | grep . || true)

          docs_only=true
          if [[ -z "$files" || "$listed" != "$expected" ]]; then
            echo "Listed ${listed} files, PR reports ${expected}: not docs-only"
            docs_only=false
          fi
          while IFS= read -r f; do
            case "$f" in
              docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$files"

          echo "Changed files (renames listed under both names):"
          echo "$files"
          if [[ "$docs_only" == "true" ]]; then
            msg="CI checks auto-passed: documentation-only change"
            echo "::notice::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "docs-only=${docs_only}" >> "$GITHUB_OUTPUT"

      # Normal SQL contexts may be skipped only when their race replacements
      # are required. Unreadable rules retain actual tests, not skip notices.
      - name: SQL race prerequisites
        id: sql-race-required
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          steps.docs-only.outputs.docs-only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          required=false
          branch=$(jq -rn --arg ref "$BASE_REF" '$ref | @uri')
          if rules=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/rules/branches/${branch}?per_page=100" \
            2>/dev/null); then
            # Collect all active rules, including organization rules and pages.
            required=$(jq -er '
              [.[][] | select(.type == "required_status_checks") |
               .parameters.required_status_checks[]?.context] as $contexts |
              ["Run unit tests (unit-race tags=\"test_db_sqlite\")",
               "Run unit tests (unit-race tags=\"test_db_postgres\")"] |
              all(. as $context | $contexts | index($context) != null)
            ' <<< "$rules" 2>/dev/null) || required=false
          fi
          echo "sql-race-required=${required}" >> "$GITHUB_OUTPUT"

      # Only a successful code draft proves shared work exists on this head.
      # A replaced pending run or unavailable API must execute fresh checks.
      - name: Verify draft results
        id: reuse-shared
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'ready_for_review' &&
          steps.docs-only.outputs.docs-only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          reuse=false
          if runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/main.yml/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
            2>/dev/null); then
            # Inspect the latest prior run, never an older convenient success.
            previous=$(jq -er --arg sha "$HEAD_SHA" \
              --arg branch "$HEAD_BRANCH" --argjson repo "$HEAD_REPO_ID" \
              --argjson current "$GITHUB_RUN_ID" '
              [.workflow_runs[] | select(.id != $current and
                .head_sha == $sha and .head_branch == $branch and
                .head_repository.id == $repo)] | max_by(.created_at) |
              select(.status == "completed" and .conclusion == "success") | .id
            ' <<< "$runs" 2>/dev/null) || previous=""
            if [[ -n "$previous" ]] && jobs=$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${previous}/jobs?filter=latest&per_page=100" \
              2>/dev/null); then
              # Actual cover excludes docs notices; a skipped default race
              # identifies the draft selection. Whole-run success proves the
              # other shared checks passed, including real normal SQL tests.
              # The gate step identifies the triggering PR; older runs
              # without that proof must execute fresh checks.
              reuse=$(jq -er --arg pr "$PR_NUMBER" '
                [.[] | .jobs[]] as $jobs |
                any($jobs[]; .name == "CI gate" and
                  .conclusion == "success" and any(.steps[];
                    .name == "Detect documentation-only changes (PR \($pr))" and
                    .conclusion == "success")) and
                any($jobs[]; .name == "Run unit tests (unit-cover)" and
                  .conclusion == "success" and any(.steps[];
                    .name == "Run unit-cover" and .conclusion == "success")) and
                any($jobs[]; .name == "Run unit tests (unit-race)" and
                  .conclusion == "success" and any(.steps[];
                    .name == "Run unit-race" and .conclusion == "skipped"))
              ' <<< "$jobs" 2>/dev/null) || reuse=false
            fi
          fi
          echo "reuse-shared=${reuse}" >> "$GITHUB_OUTPUT"

  static-checks:
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Static Checks' || 'Static Checks' }}
    needs: ci-gate
    if: >-
      ${{ !cancelled() && needs.ci-gate.outputs.reuse-shared != 'true' &&
          needs.ci-gate.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          # Needed for some checks.
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          use-build-cache: 'no'

      ########################
      # sample configuration check
      ########################
      - name: Check default values in sample-lnd.conf file
        run: make sample-conf-check

      ########################
      # Check code and RPC format
      ########################
      - name: Check code format
        run: make fmt-check

      - name: Check go modules tidiness 
        run: make tidy-module-check

      - name: Lint proto files
        run: make protolint

      ########################
      # SQLC code gen check 
      ########################
      - name: Docker image cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        # Ignore the failure of a step and avoid terminating the job.
        continue-on-error: true

      - name: Check SQL models
        run: make sqlc-check

      ########################
      # RPC and mobile compilation check
      ########################
      - name: Check RPC format
        run: make rpc-check

      - name: Check JSON/WASM stub compilation
        run: make rpc-js-compile

      - name: Check mobile RPC bindings
        run: make mobile-rpc

      - name: Check mobile specific code
        run: go build --tags="mobile" ./mobile

  ########################
  # check commits
  ########################
  check-commits:
    needs: ci-gate
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.ci-gate.outputs.reuse-shared != 'true'
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Check commits' || 'Check commits' }}
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          # Use the same cache from unit test job to save time.
          key-prefix: unit-test

      - name: fetch and rebase on ${{ github.base_ref }}
        uses: ./.github/actions/rebase

      - name: check commits
        run: scripts/check-each-commit.sh upstream/${{ github.base_ref }}

  ########################
  # lint code
  ########################
  lint:
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Lint code' || 'Lint code' }}
    needs: ci-gate
    if: >-
      ${{ !cancelled() && needs.ci-gate.outputs.reuse-shared != 'true' &&
          needs.ci-gate.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          # Use the same cache from unit test job to save time.
          key-prefix: unit-test

      - name: lint
        run: GOGC=50 make lint

      - name: lint submodules
        run: GOGC=50 make lint-module

  ########################
  # cross compilation
  ########################
  cross-compile:
    needs: ci-gate
    # Run even if the gate job failed: without a status function a
    # failed dependency skips this job, and a skipped required check
    # counts as passed.
    if: ${{ !cancelled() }}
    env:
      # Skipped for documentation-only changes and on draft PRs.
      SKIP: ${{ needs.ci-gate.outputs.docs-only == 'true' || github.event.pull_request.draft == true }}
    name: Cross compilation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Please keep this list in sync with make/release_flags.mk!
        include:
          - name: i386
            sys: freebsd-386 linux-386 windows-386
          - name: amd64
            sys: darwin-amd64 freebsd-amd64 linux-amd64 netbsd-amd64 openbsd-amd64 windows-amd64
          - name: arm
            sys: darwin-arm64 freebsd-arm linux-armv6 linux-armv7 linux-arm64 windows-arm64
    steps:
      - name: Skip notice
        if: env.SKIP == 'true'
        run: echo "::notice::Job auto-passed (documentation-only change or draft PR)"

      - name: Git checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v5

      - name: Clean up runner space
        if: env.SKIP != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Setup go ${{ env.GO_VERSION }}
        if: env.SKIP != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: cross-compile
          use-build-cache: 'no'

      - name: Build release for all architectures
        if: env.SKIP != 'true'
        run: make release sys="${{ matrix.sys }}"

  ########################
  # run unit tests
  ########################
  unit-test:
    needs: ci-gate
    # Run even if the gate job failed: without a status function a
    # failed dependency skips this job, and a skipped required check
    # counts as passed.
    if: ${{ !cancelled() }}
    env:
      # Documentation-only changes skip every leg. Draft PRs use normal SQL.
      # Verified draft results let ready events reuse non-race checks.
      # Otherwise, ready PRs skip normal SQL only if both races are required;
      # unreadable rules retain real tests under existing required names.
      # Keep each matrix leg instantiated when skipping its steps.
      SKIP: >-
        ${{ needs.ci-gate.outputs.docs-only == 'true' ||
            (needs.ci-gate.outputs.reuse-shared == 'true' &&
             !startsWith(matrix.unit_type, 'unit-race')) ||
            (github.event.pull_request.draft == true &&
             startsWith(matrix.unit_type, 'unit-race')) ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.draft == false &&
             needs.ci-gate.outputs.sql-race-required == 'true' &&
             (matrix.unit_type == 'unit tags="test_db_sqlite"' ||
              matrix.unit_type == 'unit tags="test_db_postgres"')) }}
    # A matrix reference disables automatic suffixes: spell out the full
    # existing check name so required contexts stay exact on other events.
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          !startsWith(matrix.unit_type, 'unit-race') &&
          'Prior result: ' || '' }}Run unit tests (${{ matrix.unit_type }})
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        unit_type:
          - unit-cover
          - unit tags="kvdb_postgres"
          - unit tags="kvdb_sqlite"
          - unit tags="test_db_sqlite"
          - unit tags="test_db_postgres"
          - unit-race
          - unit-race tags="test_db_sqlite"
          - unit-race tags="test_db_postgres"
          - unit-module

    steps:
      - name: Skip notice
        if: env.SKIP == 'true'
        run: echo "::notice::Job auto-passed (CI selection policy)"

      - name: Git checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        if: env.SKIP != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: env.SKIP != 'true' && github.event_name == 'pull_request'
        uses: ./.github/actions/rebase

      - name: Git checkout fuzzing seeds
        if: env.SKIP != 'true'
        uses: actions/checkout@v5
        with:
          repository: lightninglabs/lnd-fuzz
          path: lnd-fuzz

      - name: Rsync fuzzing seeds
        if: env.SKIP != 'true'
        run: rsync -a --ignore-existing lnd-fuzz/ ./

      - name: Setup go ${{ env.GO_VERSION }}
        if: env.SKIP != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: unit-test

      - name: Install bitcoind
        if: env.SKIP != 'true'
        run: ./scripts/install_bitcoind.sh $BITCOIN_VERSION

      - name: Run ${{ matrix.unit_type }}
        if: env.SKIP != 'true'
        run: make ${{ matrix.unit_type }}

      - name: Clean coverage
        run: grep -Ev '(\.pb\.go|\.pb\.json\.go|\.pb\.gw\.go)' coverage.txt > coverage-norpc.txt
        if: env.SKIP != 'true' && matrix.unit_type == 'unit-cover'

      - name: Send coverage
        uses: coverallsapp/github-action@v2
        if: env.SKIP != 'true' && matrix.unit_type == 'unit-cover'
        continue-on-error: true
        with:
          file: coverage-norpc.txt
          flag-name: 'unit'
          format: 'golang'
          parallel: true


  ########################
  # run integration tests with TRANCHES
  ########################
  basic-integration-test:
    # Required check and part of the fast subset that runs on draft PRs. Kept
    # instantiated for documentation-only changes so the per-leg checks are
    # reported; the steps are skipped instead. Verified draft reuse retains
    # per-leg results and skips this job under a distinct placeholder name.
    # Otherwise run even if the gate failed, preserving required checks.
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.reuse-shared != 'true' }}
    env:
      SKIP: ${{ needs.ci-gate.outputs.docs-only == 'true' }}
    # Expression names receive no automatic matrix suffix. Spell out each
    # executing leg's identity so existing required contexts still report.
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Run basic itests' ||
          format('Run basic itests ({0}, {1})', matrix.name, matrix.args) }}
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        include:
          - name: btcd
            args: backend=btcd cover=1
          - name: bitcoind
            args: backend=bitcoind cover=1
          - name: bitcoind-miner
            args: backend=bitcoind minerbackend=bitcoind cover=1
          - name: bitcoind-notxindex
            args: backend="bitcoind notxindex"
          - name: neutrino
            args: backend=neutrino cover=1
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for no-itest label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-itest'
          skip-message: "Tests auto-passed due to 'no-itest' label"

      - name: Clean up runner space
        if: steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        uses: ./.github/actions/rebase

      - name: Setup go ${{ env.GO_VERSION }}
        if: steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: integration-test

      - name: Install bitcoind
        if: steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        run: ./scripts/install_bitcoind.sh $BITCOIN_VERSION

      - name: Run ${{ matrix.name }}
        if: steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        run: make itest-parallel tranches=${{ env.TRANCHES }} ${{ matrix.args }} shuffleseed=${{ github.run_id }}${{ strategy.job-index }}

      - name: Clean coverage
        run: grep -Ev '(\.pb\.go|\.pb\.json\.go|\.pb\.gw\.go)' coverage.txt > coverage-norpc.txt
        if: ${{ contains(matrix.args, 'cover=1') && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true' }}

      - name: Send coverage
        if: ${{ contains(matrix.args, 'cover=1') && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true' }}
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          file: coverage-norpc.txt
          flag-name: 'itest-${{ matrix.name }}'
          format: 'golang'
          parallel: true

      - name: Zip log files on failure
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true' }}
        timeout-minutes: 5 # timeout after 5 minute
        run: 7z a logs-itest-${{ matrix.name }}.zip itest/**/*.log itest/postgres.log

      - name: Upload log files on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true' }}
        with:
          name: logs-itest-${{ matrix.name }}
          path: logs-itest-${{ matrix.name }}.zip
          retention-days: 5

  ########################
  # run integration tests with SMALL_TRANCHES
  ########################
  integration-test:
    name: Run itests
    # Not a required check, so it can be skipped at the job level. Draft PRs
    # only run the fast subset (see the unit-test and basic itest jobs).
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.docs-only != 'true' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        include:
          - name: bitcoind-rpcpolling
            args: backend="bitcoind rpcpolling"
          - name: bitcoind-sqlite
            args: backend=bitcoind dbbackend=sqlite
          - name: bitcoind-sqlite-nativesql
            args: backend=bitcoind dbbackend=sqlite nativesql=true
          - name: bitcoind-postgres
            args: backend=bitcoind dbbackend=postgres
          - name: bitcoind-postgres-nativesql
            args: backend=bitcoind dbbackend=postgres nativesql=true
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for no-itest label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-itest'
          skip-message: "Tests auto-passed due to 'no-itest' label"

      - name: Clean up runner space
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/rebase

      - name: Setup go ${{ env.GO_VERSION }}
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: integration-test

      - name: Install bitcoind
        if: steps.check-label.outputs.skip != 'true'
        run: ./scripts/install_bitcoind.sh $BITCOIN_VERSION

      - name: Run ${{ matrix.name }}
        if: steps.check-label.outputs.skip != 'true'
        run: make itest-parallel tranches=${{ env.SMALL_TRANCHES }} ${{ matrix.args }} shuffleseed=${{ github.run_id }}${{ strategy.job-index }}

      - name: Clean coverage
        run: grep -Ev '(\.pb\.go|\.pb\.json\.go|\.pb\.gw\.go)' coverage.txt > coverage-norpc.txt
        if: ${{ contains(matrix.args, 'cover=1') && steps.check-label.outputs.skip != 'true' }}

      - name: Send coverage
        if: ${{ contains(matrix.args, 'cover=1') && steps.check-label.outputs.skip != 'true' }}
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          file: coverage-norpc.txt
          flag-name: 'itest-${{ matrix.name }}'
          format: 'golang'
          parallel: true

      - name: Zip log files on failure
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        timeout-minutes: 5 # timeout after 5 minute
        run: 7z a logs-itest-${{ matrix.name }}.zip itest/**/*.log

      - name: Upload log files on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        with:
          name: logs-itest-${{ matrix.name }}
          path: logs-itest-${{ matrix.name }}.zip
          retention-days: 5


  ########################
  # run windows integration test
  ########################
  windows-integration-test:
    name: Run windows itest
    # Not a required check, so it can be skipped at the job level. Draft PRs
    # only run the fast subset (see the unit-test and basic itest jobs).
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.docs-only != 'true' && github.event.pull_request.draft != true }}
    runs-on: windows-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for no-itest label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-itest'
          skip-message: "Tests auto-passed due to 'no-itest' label"

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/rebase

      - name: Setup go ${{ env.GO_VERSION }}
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: integration-test

      - name: Run itest
        if: steps.check-label.outputs.skip != 'true'
        run: make itest-parallel tranches=${{ env.SMALL_TRANCHES }} windows=1 shuffleseed=${{ github.run_id }}
        
      - name: Kill any remaining lnd processes
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        shell: powershell
        run: taskkill /IM lnd-itest.exe /T /F

      - name: Zip log files on failure
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        timeout-minutes: 5 # timeout after 5 minute
        run: 7z a logs-itest-windows.zip itest/**/*.log

      - name: Upload log files on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        with:
          name: logs-itest-windows
          path: logs-itest-windows.zip
          retention-days: 5

  ########################
  # run macOS integration test
  ########################
  macos-integration-test:
    name: Run macOS itest
    # Not a required check, so it can be skipped at the job level. Draft PRs
    # only run the fast subset (see the unit-test and basic itest jobs).
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.docs-only != 'true' && github.event.pull_request.draft != true }}
    runs-on: macos-14
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for no-itest label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-itest'
          skip-message: "Tests auto-passed due to 'no-itest' label"

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/rebase

      - name: Setup go ${{ env.GO_VERSION }}
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: integration-test

      - name: Run itest
        if: steps.check-label.outputs.skip != 'true'
        run: make itest-parallel tranches=${{ env.SMALL_TRANCHES }} shuffleseed=${{ github.run_id }}

      - name: Zip log files on failure
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        timeout-minutes: 5 # timeout after 5 minute
        run: 7z a logs-itest-macos.zip itest/**/*.log

      - name: Upload log files on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        with:
          name: logs-itest-macos
          path: logs-itest-macos.zip
          retention-days: 5

  ########################
  # check pinned dependencies
  ########################
  dep-pin:
    needs: ci-gate
    # Run even if the gate job failed: without a status function a
    # failed dependency skips this job, and a skipped required check
    # counts as passed. Verified draft reuse retains per-leg results under
    # their original names and skips this differently named placeholder.
    if: ${{ !cancelled() && needs.ci-gate.outputs.reuse-shared != 'true' }}
    env:
      # Skipped for documentation-only changes.
      SKIP: ${{ needs.ci-gate.outputs.docs-only == 'true' }}
    # Include the pinned module explicitly: expression names otherwise
    # lose the matrix suffix that identifies the required dependency check.
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Check pinned dependencies' ||
          format('Check pinned dependencies ({0})', matrix.pinned_dep) }}
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        pinned_dep:
          - google.golang.org/grpc v1.83.1
          - github.com/golang/protobuf v1.5.4

    steps:
      - name: Skip notice
        if: env.SKIP == 'true'
        run: echo "::notice::Job auto-passed (documentation-only change)"

      - name: Git checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v5

      - name: Clean up runner space
        if: env.SKIP != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Ensure dependencies at correct version
        if: env.SKIP != 'true'
        run: if ! grep -q "${{ matrix.pinned_dep }}" go.mod; then echo dependency ${{ matrix.pinned_dep }} should not be altered ; exit 1 ; fi

  ########################
  # check PR updates release notes
  ########################
  milestone-check:
    needs: ci-gate
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Check release notes updated' ||
          'Check release notes updated' }}
    if: ${{ !cancelled() && needs.ci-gate.outputs.reuse-shared != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          # The check compares the PR's merge commit against its first
          # parent, the base branch, to find the release note fragments
          # added by the PR.
          fetch-depth: 2

      - name: Check for no-changelog label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-changelog'
          skip-message: "Changelog check auto-passed due to 'no-changelog' label"

      - name: Clean up runner space
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Release notes check
        if: steps.check-label.outputs.skip != 'true'
        run: scripts/check-release-notes.sh

  ########################
  # check release notes are consistent with the fragments
  ########################
  release-notes-consistency:
    needs: ci-gate
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Check release notes consistency' ||
          'Check release notes consistency' }}
    if: ${{ !cancelled() && needs.ci-gate.outputs.reuse-shared != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          # The check compares the PR's merge commit against its first
          # parent, the base branch, to detect version bumps.
          fetch-depth: 2

      # This job intentionally ignores the no-changelog label: the PRs that
      # fold release note fragments or bump the version carry that label.
      - name: Release notes consistency check
        run: scripts/check-release-notes-consistency.sh pr

  ########################
  # Backwards Compatibility Test
  ########################
  backwards-compatibility-test:
    name: Backwards compatibility test
    # Not a required check, so it can be skipped at the job level. Draft PRs
    # only run the fast subset (see the unit-test and basic itest jobs).
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.docs-only != 'true' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛡️ Backwards compatibility test
        run: make backwards-compat-test

      - name: 📋 Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bw-compat-logs
          path: scripts/bw-compatibility-test/logs/
          retention-days: 7

  #########################################
  # Auto Cache Cleanup on Pull Requests
  #########################################
  auto-cleanup-cache:
    needs: ci-gate
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Cache Cleanup' || 'Cache Cleanup' }}
    runs-on: ubuntu-latest

    # This condition checks for pull requests from authors with write access.
    if: >-
      !cancelled() && needs.ci-gate.outputs.reuse-shared != 'true' &&
      contains('OWNER, MEMBER, COLLABORATOR', github.event.pull_request.author_association)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Delete caches older than 12 hours
        continue-on-error: true
        env:
          # GITHUB_TOKEN is required for the gh CLI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Finding caches not used in the last 12 hours..."

          # Get the current time and the cutoff time (12 hours ago) in Unix
          # timestamp format.
          cutoff_timestamp=$(date -d "12 hours ago" +%s)

          # Use gh and jq to parse caches. Delete any cache last accessed
          # before the cutoff time.
          gh cache list --json key,lastAccessedAt | jq -r '.[] |
          select(.lastAccessedAt != null) | "\(.lastAccessedAt) \(.key)"' |
          while read -r last_accessed_at key; do
            last_accessed_timestamp=$(date -d "$last_accessed_at" +%s)

            if (( last_accessed_timestamp < cutoff_timestamp )); then
              echo "Deleting old cache. Key: $key, Last Used: $last_accessed_at"
              gh cache delete "$key"
            fi
          done

  # Notify after fresh coverage collection. Verified draft reuse submits no
  # new parallel coverage; fallback execution still needs its own finalizer.
  finish:
    name: >-
      ${{ needs.ci-gate.outputs.reuse-shared == 'true' &&
          'Prior result: Send coverage report' || 'Send coverage report' }}
    if: >-
      ${{ !cancelled() && needs.ci-gate.outputs.reuse-shared != 'true' &&
          needs.ci-gate.outputs.docs-only != 'true' }}
    needs: [ci-gate, unit-test, basic-integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send coverage
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          parallel-finished: true
