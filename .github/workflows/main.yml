name: CI

# The jobs of this workflow are split into three tiers, selected by the CI
# gate job below:
#
#   pr:      Pull requests. Only the fast checks run (lint, static checks,
#            commit checks, release notes, pinned dependencies, the i386 and
#            amd64 cross compilation and the unit-cover and unit-module unit
#            tests). Adding the full-ci label to a PR runs the merge tier
#            instead.
#   merge:   Merge queue. The real gate: the pr tier plus the full unit test
#            matrix, the basic itests, the key database itests, the arm cross
#            compilation and the backwards compatibility test.
#   nightly: Scheduled and manual runs on master, see nightly.yml. Everything
#            of the merge tier plus the remaining itests, the Windows and
#            macOS itests and the coverage report.
#   held:    Pull requests carrying the ci-hold label. New PRs get the label
#            from ci-hold.yml when they are opened, so that their CI doesn't
#            occupy any runners until a maintainer removes it. All jobs skip
#            and the CI result job fails, so a held PR can't enter the merge
#            queue. Removing the label re-runs the PR's latest run, see
#            ci-hold.yml. Merge group and nightly runs are never held.
#
# Required status checks apply to both the pull_request and the merge_group
# context, so every required check has to be reported in both. Required matrix
# legs that don't belong to the pr tier therefore stay instantiated on pull
# requests and only skip their steps: a job-level condition is evaluated before
# the matrix is expanded, so a skipped matrix job would never report the
# per-leg check names. The CI result job aggregates the results of all gating
# jobs into a single check, so that the jobs of the merge tier can be required
# without listing every leg.
on:
  pull_request:
    branches:
      - "*"
    # ready_for_review and converted_to_draft are added so that changing the
    # draft state of a PR triggers a new run: draft PRs skip the cross
    # compilation, so the run has to be replaced whenever the state changes.
    # The concurrency group below cancels the previous one.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    branches:
      - "master"
  # Used by nightly.yml to run the nightly tier.
  workflow_call:
    inputs:
      tier:
        description: "The tier to run, only nightly is supported"
        type: string
        required: true

permissions:
  # Required to manage and delete caches.
  actions: write
  # Default permission for checking out code.
  contents: read
  # Required to read the current PR labels and label events via the API in
  # the CI gate job and in check-label.
  pull-requests: read

concurrency:
  # Cancel any previous workflows from the same PR or merge group. Nightly
  # runs wait for the previous one instead of cancelling it.
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.tier != 'nightly' }}

defaults:
  run:
    shell: bash

env:
  # Accepts either a major image tag like "30" or a patch tag like "29.1".
  BITCOIN_VERSION: "31"
  
  # TRANCHES defines the number of tranches used in the itests.
  TRANCHES: 16

  # SMALL_TRANCHES defines the number of tranches used in the less stable itest
  # builds
  #
  # TODO(yy): remove this value and use TRANCHES.
  SMALL_TRANCHES: 8

  # If you change this please also update GO_VERSION in Makefile (then run
  # `make lint` to see where else it needs to be updated as well).
  GO_VERSION: 1.27.3

jobs:
  ########################
  # CI gate: select the tier and detect documentation-only changes
  ########################
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    outputs:
      # One of held, pr, merge or nightly, see the top of this file.
      tier: ${{ steps.tier.outputs.tier }}
      # True when the PR only touches files under docs/ or markdown files.
      # Merge group and nightly runs never set this.
      docs-only: ${{ steps.docs-only.outputs.docs-only }}
    steps:
      # The labels are read from the API rather than the event payload, so
      # that re-running the workflow after adding the full-ci label or
      # removing the ci-hold label picks it up. If the labels can't be read
      # the PR runs the pr tier; the merge queue runs the merge tier
      # regardless.
      #
      # The run for a newly opened PR starts at the same time as ci-hold.yml,
      # which adds the ci-hold label, so the label may not be visible yet.
      # The first attempt of such a run is therefore held unless the label
      # has already been removed again, which is the case when the run was
      # waiting for approval (PRs of first-time contributors) while a
      # maintainer removed the label. Re-runs (attempt 2 and up, as started
      # by ci-hold.yml) only look at the current labels. PRs opened with the
      # GITHUB_TOKEN, such as the backport PRs, are exempt: they don't
      # trigger ci-hold.yml, so they never get the label, and their runs
      # already wait for a maintainer's approval.
      - name: Select tier
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_TIER: ${{ inputs.tier }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HOLD_LABEL: ci-hold
        run: |
          if [[ "$INPUT_TIER" == "nightly" ]]; then
            tier=nightly
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            tier=merge
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            tier=pr
            labels=$(gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels?per_page=100" \
              --jq '[.[].name]') || labels='[]'
            echo "Labels: ${labels}"

            if jq -e --arg l "$HOLD_LABEL" 'index($l) != null' \
              <<< "$labels" > /dev/null; then

              tier=held
            elif [[ "$EVENT_ACTION" == "opened" && \
              "$GITHUB_RUN_ATTEMPT" == "1" && \
              "$GITHUB_ACTOR" != "github-actions[bot]" ]]; then

              # If the events can't be read the run stays held.
              removed=$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
                --jq '.[] | select(.event == "unlabeled"
                  and .label.name == env.HOLD_LABEL) | .id') || removed=""
              if [[ -z "$removed" ]]; then
                tier=held
              fi
            fi

            if [[ "$tier" == "held" ]]; then
              msg="CI is held, remove the ${HOLD_LABEL} label to run it"
              echo "::notice::${msg}"
              echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
            elif jq -e 'index("full-ci") != null' <<< "$labels" > /dev/null; then
              echo "::notice::Running the merge tier due to the 'full-ci' label"
              tier=merge
            fi
          else
            echo "::error::Unsupported event ${EVENT_NAME} (tier '${INPUT_TIER}')"
            exit 1
          fi

          echo "Selected tier: ${tier}"
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"

      # Anything that isn't under docs/ or a markdown file counts as code and
      # runs full CI. Renamed files are checked under both their old and new
      # name so that moving a source file into docs/ doesn't count as a
      # documentation change. An empty or failed file listing is treated as
      # "not docs only".
      #
      # Jobs consuming this output either skip at the job level (non-matrix
      # jobs) or keep the job instantiated and skip its steps (matrix jobs).
      # The latter is needed because a job-level condition is evaluated
      # before the matrix is expanded, so a skipped matrix job would never
      # report the per-leg check names that branch protection requires.
      - name: Detect documentation-only changes
        id: docs-only
        if: github.event_name == 'pull_request' && steps.tier.outputs.tier != 'held'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # One entry per changed file: new name, tab, old name (empty
          # unless renamed). On any API failure the listing is empty.
          entries=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' \
            2>/dev/null) || entries=""

          # The files endpoint returns at most 3000 entries. Cross-check the
          # number of listed files against the PR's own count so that a
          # truncated listing can never hide a code change.
          expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.changed_files' 2>/dev/null) || expected="unknown"
          listed=$(grep -c . <<< "$entries" || true)

          # Both names of a renamed file are checked.
          files=$(tr '\t' '\n' <<< "$entries" | grep . || true)

          docs_only=true
          if [[ -z "$files" || "$listed" != "$expected" ]]; then
            echo "Listed ${listed} files, PR reports ${expected}: not docs-only"
            docs_only=false
          fi
          while IFS= read -r f; do
            case "$f" in
              docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$files"

          echo "Changed files (renames listed under both names):"
          echo "$files"
          if [[ "$docs_only" == "true" ]]; then
            msg="CI checks auto-passed: documentation-only change"
            echo "::notice::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "docs-only=${docs_only}" >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static Checks
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.docs-only != 'true' && needs.ci-gate.outputs.tier != 'held' }}
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          # Needed for some checks.
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          use-build-cache: 'no'

      ########################
      # sample configuration check
      ########################
      - name: Check default values in sample-lnd.conf file
        run: make sample-conf-check

      ########################
      # Check code and RPC format
      ########################
      - name: Check code format
        run: make fmt-check

      - name: Check go modules tidiness 
        run: make tidy-module-check

      - name: Lint proto files
        run: make protolint

      ########################
      # SQLC code gen check 
      ########################
      - name: Docker image cache
        uses: satackey/action-docker-layer-caching@v0.0.11
        # Ignore the failure of a step and avoid terminating the job.
        continue-on-error: true

      - name: Check SQL models
        run: make sqlc-check

      ########################
      # RPC and mobile compilation check
      ########################
      - name: Check RPC format
        run: make rpc-check

      - name: Check JSON/WASM stub compilation
        run: make rpc-js-compile

      - name: Check mobile RPC bindings
        run: make mobile-rpc

      - name: Check mobile specific code
        run: go build --tags="mobile" ./mobile

  ########################
  # check commits
  ########################
  check-commits:
    # Waits for the gate job only to learn whether CI is held.
    needs: ci-gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.ci-gate.outputs.tier != 'held' }}
    name: Check commits
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          # Use the same cache from unit test job to save time.
          key-prefix: unit-test

      - name: fetch and rebase on ${{ github.base_ref }}
        uses: ./.github/actions/rebase

      - name: check commits
        run: scripts/check-each-commit.sh upstream/${{ github.base_ref }}

  ########################
  # lint code
  ########################
  lint:
    name: Lint code
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.docs-only != 'true' && needs.ci-gate.outputs.tier != 'held' }}
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          # Use the same cache from unit test job to save time.
          key-prefix: unit-test

      - name: lint
        run: GOGC=50 make lint

      - name: lint submodules
        run: GOGC=50 make lint-module

  ########################
  # cross compilation
  ########################
  cross-compile:
    needs: ci-gate
    # Run even if the gate job failed: without a status function a
    # failed dependency skips this job, and a skipped required check
    # counts as passed.
    if: ${{ !cancelled() }}
    env:
      # Skipped for documentation-only changes, on draft PRs and when CI is
      # held.
      SKIP: ${{ needs.ci-gate.outputs.docs-only == 'true' || github.event.pull_request.draft == true || needs.ci-gate.outputs.tier == 'held' }}
    name: Cross compilation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Please keep this list, together with the one of the
        # cross-compile-arm job, in sync with make/release_flags.mk!
        include:
          - name: i386
            sys: freebsd-386 linux-386 windows-386
          - name: amd64
            sys: darwin-amd64 freebsd-amd64 linux-amd64 netbsd-amd64 openbsd-amd64 windows-amd64
    steps:
      - name: Skip notice
        if: env.SKIP == 'true'
        run: echo "::notice::Job auto-passed (documentation-only change, draft PR or CI held)"

      - name: Git checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v5

      - name: Clean up runner space
        if: env.SKIP != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Setup go ${{ env.GO_VERSION }}
        if: env.SKIP != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: cross-compile
          use-build-cache: 'no'

      - name: Build release for all architectures
        if: env.SKIP != 'true'
        run: make release sys="${{ matrix.sys }}"

  ########################
  # cross compilation of the arm targets (merge and nightly tiers)
  ########################
  cross-compile-arm:
    # Not a required check, so it can be skipped at the job level. It uses the
    # same name as the cross-compile job so the check names don't change.
    needs: ci-gate
    if: ${{ !cancelled() && (needs.ci-gate.outputs.tier == 'merge' || needs.ci-gate.outputs.tier == 'nightly') }}
    name: Cross compilation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: arm
            sys: darwin-arm64 freebsd-arm linux-armv6 linux-armv7 linux-arm64 windows-arm64
    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: Setup go ${{ env.GO_VERSION }}
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: cross-compile
          use-build-cache: 'no'

      - name: Build release for all architectures
        run: make release sys="${{ matrix.sys }}"

  ########################
  # run unit tests
  ########################
  unit-test:
    needs: ci-gate
    # Run even if the gate job failed: without a status function a
    # failed dependency skips this job, and a skipped required check
    # counts as passed.
    if: ${{ !cancelled() }}
    env:
      # Skipped for documentation-only changes and when CI is held. The pr
      # tier only runs the unit-cover and unit-module legs, the other legs are
      # kept instantiated so that the required per-leg checks are reported
      # (see the top of this file).
      SKIP: ${{ needs.ci-gate.outputs.docs-only == 'true' || needs.ci-gate.outputs.tier == 'held' || (needs.ci-gate.outputs.tier == 'pr' && matrix.unit_type != 'unit-cover' && matrix.unit_type != 'unit-module') }}
    name: Run unit tests
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        unit_type:
          - unit-cover
          - unit tags="kvdb_etcd"
          - unit tags="kvdb_postgres"
          - unit tags="kvdb_sqlite"
          - unit tags="test_db_sqlite"
          - unit tags="test_db_postgres"
          - unit-race
          - unit-race tags="test_db_sqlite"
          - unit-race tags="test_db_postgres"
          - unit-module

    steps:
      - name: Skip notice
        if: env.SKIP == 'true'
        run: echo "::notice::Job auto-passed (documentation-only change, CI held, or not part of the PR tier and runs in the merge queue)"

      - name: Git checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        if: env.SKIP != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: env.SKIP != 'true' && github.event_name == 'pull_request'
        uses: ./.github/actions/rebase

      - name: Git checkout fuzzing seeds
        if: env.SKIP != 'true'
        uses: actions/checkout@v5
        with:
          repository: lightninglabs/lnd-fuzz
          path: lnd-fuzz

      - name: Rsync fuzzing seeds
        if: env.SKIP != 'true'
        run: rsync -a --ignore-existing lnd-fuzz/ ./

      - name: Setup go ${{ env.GO_VERSION }}
        if: env.SKIP != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: unit-test

      - name: Install bitcoind
        if: env.SKIP != 'true'
        run: ./scripts/install_bitcoind.sh $BITCOIN_VERSION

      - name: Run ${{ matrix.unit_type }}
        if: env.SKIP != 'true'
        run: make ${{ matrix.unit_type }}

      # Coverage is only reported by the nightly tier, which runs the complete
      # set of coverage collecting jobs.
      - name: Clean coverage
        run: grep -Ev '(\.pb\.go|\.pb\.json\.go|\.pb\.gw\.go)' coverage.txt > coverage-norpc.txt
        if: env.SKIP != 'true' && matrix.unit_type == 'unit-cover' && needs.ci-gate.outputs.tier == 'nightly'

      - name: Send coverage
        uses: coverallsapp/github-action@v2
        if: env.SKIP != 'true' && matrix.unit_type == 'unit-cover' && needs.ci-gate.outputs.tier == 'nightly'
        continue-on-error: true
        with:
          file: coverage-norpc.txt
          flag-name: 'unit'
          format: 'golang'
          parallel: true


  ########################
  # run integration tests with TRANCHES
  ########################
  basic-integration-test:
    # Required check of the merge tier. Kept instantiated in the pr and held
    # tiers and for documentation-only changes so the per-leg checks are
    # reported; the steps are skipped instead. Runs even if the gate job
    # failed: without a status function a failed dependency skips this job,
    # and a skipped required check counts as passed.
    needs: ci-gate
    if: ${{ !cancelled() }}
    env:
      SKIP: ${{ needs.ci-gate.outputs.docs-only == 'true' || needs.ci-gate.outputs.tier == 'pr' || needs.ci-gate.outputs.tier == 'held' }}
    name: Run basic itests
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        include:
          - name: btcd
            args: backend=btcd cover=1
          - name: bitcoind
            args: backend=bitcoind cover=1
          - name: bitcoind-miner
            args: backend=bitcoind minerbackend=bitcoind cover=1
          - name: bitcoind-notxindex
            args: backend="bitcoind notxindex"
          - name: neutrino
            args: backend=neutrino cover=1
    steps:
      - name: Skip notice
        if: env.SKIP == 'true'
        run: echo "::notice::Job auto-passed (documentation-only change, CI held, or not part of the PR tier and runs in the merge queue)"

      - name: Git checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for no-itest label
        if: env.SKIP != 'true'
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-itest'
          skip-message: "Tests auto-passed due to 'no-itest' label"

      - name: Clean up runner space
        if: steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        uses: ./.github/actions/rebase

      - name: Setup go ${{ env.GO_VERSION }}
        if: steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: integration-test

      - name: Install bitcoind
        if: steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        run: ./scripts/install_bitcoind.sh $BITCOIN_VERSION

      - name: Run ${{ matrix.name }}
        if: steps.check-label.outputs.skip != 'true' && env.SKIP != 'true'
        run: make itest-parallel tranches=${{ env.TRANCHES }} ${{ matrix.args }} shuffleseed=${{ github.run_id }}${{ strategy.job-index }}

      # Coverage is only reported by the nightly tier. The cover=1 arguments
      # are kept in the other tiers as they are part of the required check
      # names.
      - name: Clean coverage
        run: grep -Ev '(\.pb\.go|\.pb\.json\.go|\.pb\.gw\.go)' coverage.txt > coverage-norpc.txt
        if: ${{ contains(matrix.args, 'cover=1') && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true' && needs.ci-gate.outputs.tier == 'nightly' }}

      - name: Send coverage
        if: ${{ contains(matrix.args, 'cover=1') && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true' && needs.ci-gate.outputs.tier == 'nightly' }}
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          file: coverage-norpc.txt
          flag-name: 'itest-${{ matrix.name }}'
          format: 'golang'
          parallel: true

      - name: Zip log files on failure
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true' }}
        timeout-minutes: 5 # timeout after 5 minute
        run: 7z a logs-itest-${{ matrix.name }}.zip itest/**/*.log itest/postgres.log

      - name: Upload log files on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' && env.SKIP != 'true' }}
        with:
          name: logs-itest-${{ matrix.name }}
          path: logs-itest-${{ matrix.name }}.zip
          retention-days: 5

  ########################
  # run integration tests with SMALL_TRANCHES (merge and nightly tiers)
  ########################
  integration-test:
    name: Run itests
    # Not a required check, so it can be skipped at the job level. The legs
    # gate the merge queue through the CI result job. The remaining database
    # variants only run in the nightly tier, see integration-test-nightly.
    needs: ci-gate
    if: ${{ !cancelled() && (needs.ci-gate.outputs.tier == 'merge' || needs.ci-gate.outputs.tier == 'nightly') }}
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        include:
          - name: bitcoind-etcd
            args: backend=bitcoind dbbackend=etcd
          - name: bitcoind-sqlite
            args: backend=bitcoind dbbackend=sqlite
          - name: bitcoind-postgres
            args: backend=bitcoind dbbackend=postgres
    steps: &integration-test-steps
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for no-itest label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-itest'
          skip-message: "Tests auto-passed due to 'no-itest' label"

      - name: Clean up runner space
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/rebase

      - name: Setup go ${{ env.GO_VERSION }}
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: integration-test

      - name: Install bitcoind
        if: steps.check-label.outputs.skip != 'true'
        run: ./scripts/install_bitcoind.sh $BITCOIN_VERSION

      - name: Run ${{ matrix.name }}
        if: steps.check-label.outputs.skip != 'true'
        run: make itest-parallel tranches=${{ env.SMALL_TRANCHES }} ${{ matrix.args }} shuffleseed=${{ github.run_id }}${{ strategy.job-index }}

      - name: Zip log files on failure
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        timeout-minutes: 5 # timeout after 5 minute
        run: 7z a logs-itest-${{ matrix.name }}.zip itest/**/*.log

      - name: Upload log files on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        with:
          name: logs-itest-${{ matrix.name }}
          path: logs-itest-${{ matrix.name }}.zip
          retention-days: 5

  ########################
  # run the remaining integration tests with SMALL_TRANCHES (nightly tier)
  ########################
  integration-test-nightly:
    # Uses the same name and steps as the integration-test job so the check
    # names don't change.
    name: Run itests
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.tier == 'nightly' }}
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        include:
          - name: bitcoind-rpcpolling
            args: backend="bitcoind rpcpolling"
          - name: bitcoind-sqlite-nativesql
            args: backend=bitcoind dbbackend=sqlite nativesql=true
          - name: bitcoind-sqlite=nativesql-experiment
            args: backend=bitcoind dbbackend=sqlite nativesql=true tags=test_native_sql
          - name: bitcoind-postgres-nativesql
            args: backend=bitcoind dbbackend=postgres nativesql=true
          - name: bitcoind-postgres-nativesql-experiment
            args: backend=bitcoind dbbackend=postgres nativesql=true tags=test_native_sql
    steps: *integration-test-steps

  ########################
  # run windows integration test
  ########################
  windows-integration-test:
    name: Run windows itest
    # Not a required check, so it can be skipped at the job level. Only runs
    # in the nightly tier.
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.tier == 'nightly' }}
    runs-on: windows-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for no-itest label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-itest'
          skip-message: "Tests auto-passed due to 'no-itest' label"

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/rebase

      - name: Setup go ${{ env.GO_VERSION }}
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: integration-test

      - name: Run itest
        if: steps.check-label.outputs.skip != 'true'
        run: make itest-parallel tranches=${{ env.SMALL_TRANCHES }} windows=1 shuffleseed=${{ github.run_id }}
        
      - name: Kill any remaining lnd processes
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        shell: powershell
        run: taskkill /IM lnd-itest.exe /T /F

      - name: Zip log files on failure
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        timeout-minutes: 5 # timeout after 5 minute
        run: 7z a logs-itest-windows.zip itest/**/*.log

      - name: Upload log files on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        with:
          name: logs-itest-windows
          path: logs-itest-windows.zip
          retention-days: 5

  ########################
  # run macOS integration test
  ########################
  macos-integration-test:
    name: Run macOS itest
    # Not a required check, so it can be skipped at the job level. Only runs
    # in the nightly tier.
    needs: ci-gate
    if: ${{ !cancelled() && needs.ci-gate.outputs.tier == 'nightly' }}
    runs-on: macos-14
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for no-itest label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-itest'
          skip-message: "Tests auto-passed due to 'no-itest' label"

      - name: Fetch and rebase on ${{ github.base_ref }}
        if: github.event_name == 'pull_request' && steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/rebase

      - name: Setup go ${{ env.GO_VERSION }}
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/setup-go
        with:
          go-version: '${{ env.GO_VERSION }}'
          key-prefix: integration-test

      - name: Run itest
        if: steps.check-label.outputs.skip != 'true'
        run: make itest-parallel tranches=${{ env.SMALL_TRANCHES }} shuffleseed=${{ github.run_id }}

      - name: Zip log files on failure
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        timeout-minutes: 5 # timeout after 5 minute
        run: 7z a logs-itest-macos.zip itest/**/*.log

      - name: Upload log files on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.check-label.outputs.skip != 'true' }}
        with:
          name: logs-itest-macos
          path: logs-itest-macos.zip
          retention-days: 5

  ########################
  # check pinned dependencies
  ########################
  dep-pin:
    needs: ci-gate
    # Run even if the gate job failed: without a status function a
    # failed dependency skips this job, and a skipped required check
    # counts as passed.
    if: ${{ !cancelled() }}
    env:
      # Skipped for documentation-only changes.
      SKIP: ${{ needs.ci-gate.outputs.docs-only == 'true' || needs.ci-gate.outputs.tier == 'held' }}
    name: Check pinned dependencies
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        pinned_dep:
          - google.golang.org/grpc v1.83.1
          - github.com/golang/protobuf v1.5.4

    steps:
      - name: Skip notice
        if: env.SKIP == 'true'
        run: echo "::notice::Job auto-passed (documentation-only change or CI held)"

      - name: Git checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v5

      - name: Clean up runner space
        if: env.SKIP != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Ensure dependencies at correct version
        if: env.SKIP != 'true'
        run: if ! grep -q "${{ matrix.pinned_dep }}" go.mod; then echo dependency ${{ matrix.pinned_dep }} should not be altered ; exit 1 ; fi

  ########################
  # check PR updates release notes
  ########################
  milestone-check:
    name: Check release notes updated
    # Only meaningful for pull requests, the nightly tier skips it.
    # Waits for the gate job only to learn whether CI is held.
    needs: ci-gate
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.ci-gate.outputs.tier != 'held' }}
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          # The check compares the PR's merge commit against its first
          # parent, the base branch, to find the release note fragments
          # added by the PR.
          fetch-depth: 2

      - name: Check for no-changelog label
        id: check-label
        uses: ./.github/actions/check-label
        with:
          label: 'no-changelog'
          skip-message: "Changelog check auto-passed due to 'no-changelog' label"

      - name: Clean up runner space
        if: steps.check-label.outputs.skip != 'true'
        uses: ./.github/actions/cleanup-space

      - name: Release notes check
        if: steps.check-label.outputs.skip != 'true'
        run: scripts/check-release-notes.sh

  ########################
  # check release notes are consistent with the fragments
  ########################
  release-notes-consistency:
    name: Check release notes consistency
    # Only meaningful for pull requests, the nightly tier skips it.
    # Waits for the gate job only to learn whether CI is held.
    needs: ci-gate
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.ci-gate.outputs.tier != 'held' }}
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          # The check compares the PR's merge commit against its first
          # parent, the base branch, to detect version bumps.
          fetch-depth: 2

      # This job intentionally ignores the no-changelog label: the PRs that
      # fold release note fragments or bump the version carry that label.
      - name: Release notes consistency check
        run: scripts/check-release-notes-consistency.sh pr

  ########################
  # Backwards Compatibility Test
  ########################
  backwards-compatibility-test:
    name: Backwards compatibility test
    # Not a required check, so it can be skipped at the job level. Gates the
    # merge queue through the CI result job.
    needs: ci-gate
    if: ${{ !cancelled() && (needs.ci-gate.outputs.tier == 'merge' || needs.ci-gate.outputs.tier == 'nightly') }}
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛡️ Backwards compatibility test
        run: make backwards-compat-test

      - name: 📋 Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bw-compat-logs
          path: scripts/bw-compatibility-test/logs/
          retention-days: 7

  #########################################
  # Auto Cache Cleanup on Pull Requests
  #########################################
  auto-cleanup-cache:
    name: Cache Cleanup
    runs-on: ubuntu-latest

    # This condition checks for pull requests from authors with write access.
    # Held pull requests don't use any runners.
    needs: ci-gate
    if: >-
      contains('OWNER, MEMBER, COLLABORATOR', github.event.pull_request.author_association) &&
      needs.ci-gate.outputs.tier != 'held'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Delete caches older than 12 hours
        continue-on-error: true
        env:
          # GITHUB_TOKEN is required for the gh CLI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Finding caches not used in the last 12 hours..."

          # Get the current time and the cutoff time (12 hours ago) in Unix
          # timestamp format.
          cutoff_timestamp=$(date -d "12 hours ago" +%s)

          # Use gh and jq to parse caches. Delete any cache last accessed
          # before the cutoff time.
          gh cache list --json key,lastAccessedAt | jq -r '.[] |
          select(.lastAccessedAt != null) | "\(.lastAccessedAt) \(.key)"' |
          while read -r last_accessed_at key; do
            last_accessed_timestamp=$(date -d "$last_accessed_at" +%s)

            if (( last_accessed_timestamp < cutoff_timestamp )); then
              echo "Deleting old cache. Key: $key, Last Used: $last_accessed_at"
              gh cache delete "$key"
            fi
          done

  # Notify about the completion of all coverage collecting jobs. Coverage is
  # only reported by the nightly tier.
  finish:
    name: Send coverage report
    if: ${{ !cancelled() && needs.ci-gate.outputs.tier == 'nightly' }}
    needs: [ci-gate, unit-test, basic-integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send coverage
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          parallel-finished: true

  ########################
  # CI result: aggregate the gating jobs into a single check
  ########################
  ci-result:
    name: CI result
    # Runs for failed and cancelled dependencies too, so that they are reported
    # as a failure instead of skipping this job: a skipped required check
    # counts as passed. Merge group and nightly runs report even when they are
    # cancelled. A pull request run is cancelled when it's superseded by a new
    # push, and must not wait for a runner afterwards: it would hold the
    # concurrency group and delay the new run. Cancelling a pull request run
    # can't let a change merge untested, since the merge tier still has to
    # pass in the merge queue.
    if: ${{ !cancelled() || github.event_name != 'pull_request' }}
    needs:
      - ci-gate
      - static-checks
      - check-commits
      - lint
      - cross-compile
      - cross-compile-arm
      - unit-test
      - basic-integration-test
      - integration-test
      - integration-test-nightly
      - windows-integration-test
      - macos-integration-test
      - dep-pin
      - milestone-check
      - release-notes-consistency
      - backwards-compatibility-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job must have succeeded or have been skipped. Skipping is only
      # allowed for the jobs that aren't listed for the selected tier, so
      # that a job that was skipped by mistake can never let the merge queue
      # pass. In the pr tier the static checks and lint may be skipped for
      # documentation-only changes. A held run always fails, so that a PR
      # whose CI never ran can't enter the merge queue.
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.ci-gate.outputs.tier }}
        run: |
          if [[ "$TIER" == "held" ]]; then
            msg="CI is held, remove the ci-hold label to run it"
            echo "::error::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          pr_jobs="ci-gate check-commits cross-compile unit-test
            basic-integration-test dep-pin milestone-check
            release-notes-consistency"
          merge_jobs="ci-gate static-checks lint cross-compile cross-compile-arm
            unit-test basic-integration-test integration-test dep-pin
            milestone-check release-notes-consistency
            backwards-compatibility-test"
          nightly_jobs="ci-gate static-checks lint cross-compile
            cross-compile-arm unit-test basic-integration-test integration-test
            integration-test-nightly windows-integration-test
            macos-integration-test dep-pin backwards-compatibility-test"

          case "$TIER" in
            pr) must_succeed=$pr_jobs ;;
            merge) must_succeed=$merge_jobs ;;
            nightly) must_succeed=$nightly_jobs ;;
            *) echo "::error::Unknown tier '${TIER}'"; exit 1 ;;
          esac

          # Pad the list with spaces to match whole job names only.
          must_succeed=" $(echo $must_succeed) "

          echo "Tier: ${TIER}"
          failed=0
          for job in $(jq -r 'keys[]' <<< "$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<< "$NEEDS")
            echo "${job}: ${result}"
            if [[ "$result" == "success" ]]; then
              continue
            fi
            if [[ "$result" == "skipped" && "$must_succeed" != *" ${job} "* ]]; then
              continue
            fi
            echo "::error::Job ${job} finished with result ${result}"
            failed=1
          done

          exit $failed
