\* Green, the headline. Under Fairness, which is A-FAIR stated in TLA+,
\* the graph eventually syncs whenever a non-pinned peer (with a quota) or
\* a pinned peer (with any quota) stays connected, even though syncers may
\* fail any number of times.

SPECIFICATION Spec

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = FALSE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

PROPERTIES
    GraphEventuallySynced
    GraphEventuallySyncedWithPinned
