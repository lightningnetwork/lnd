\* Must fail: GraphEventuallySynced. Without drain fairness, a syncer that
\* failed once may drain forever, and refuse every later attempt as busy.

SPECIFICATION SpecNoDrainFairness

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = FALSE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

PROPERTIES
    GraphEventuallySynced
