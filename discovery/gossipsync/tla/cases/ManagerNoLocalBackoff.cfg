\* Must fail: GoalH. A local fault that is not backed off lets settle
\* restart the same peer in the epoch in which it failed.

SPECIFICATION SafetySpec

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = FALSE
    NoPinnedRetry = FALSE
    NoLocalBackoff = TRUE

PROPERTIES
    GoalH
