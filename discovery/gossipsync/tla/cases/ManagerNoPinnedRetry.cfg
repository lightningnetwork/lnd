\* Must fail: GraphEventuallySyncedWithPinned. Without the pinned retry, a
\* pinned peer whose attempt failed is never retried while it stays
\* connected, so with a quota of zero the graph never syncs.

SPECIFICATION Spec

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = FALSE
    NoPinnedRetry = TRUE
    NoLocalBackoff = FALSE

PROPERTIES
    GraphEventuallySyncedWithPinned
