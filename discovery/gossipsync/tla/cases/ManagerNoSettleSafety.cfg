\* Must fail: GoalA. Without settle, an unsynced manager with an eligible
\* peer can be left with no tracked attempt.

SPECIFICATION SafetySpec

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = TRUE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

INVARIANTS
    GoalA
