\* Must fail: GraphEventuallySynced. Without settle and without ticks,
\* nothing ever starts the initial sync, even with syncers that never fail.

SPECIFICATION SpecNoTickFairness

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = FALSE
    NoSettle = TRUE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

PROPERTIES
    GraphEventuallySynced
