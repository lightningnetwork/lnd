\* Green. Settle removed, but ticks fair: the graph still eventually syncs,
\* since every tick starts an attempt on an eligible peer. Settle is what
\* makes the initial sync start at once (goal (a), ManagerNoSettleSafety),
\* and what makes it start at all when ticks don't come
\* (ManagerNoSettleStarves), but fair ticks alone are enough for liveness.

SPECIFICATION Spec

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = TRUE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

PROPERTIES
    GraphEventuallySynced
    GraphEventuallySyncedWithPinned
