\* Must fail: GraphEventuallySynced. Without take fairness, a syncer may
\* never pick up the start of the tracked attempt, which then stays in
\* flight forever.

SPECIFICATION SpecNoTakeFairness

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = FALSE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

PROPERTIES
    GraphEventuallySynced
