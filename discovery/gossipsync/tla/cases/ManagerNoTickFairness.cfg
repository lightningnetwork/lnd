\* Must fail: GraphEventuallySynced. Without tick fairness, a peer whose
\* attempt failed is backed off for an epoch that never ends.

SPECIFICATION SpecNoTickFairness

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = FALSE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

PROPERTIES
    GraphEventuallySynced
