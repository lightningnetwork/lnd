\* Green. Every safety goal, (a) to (h), over every workload of connects,
\* disconnects, ticks, rotations and outcomes, with every quota up to two
\* and every choice of pinned peers.

SPECIFICATION SafetySpec

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = FALSE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

INVARIANTS
    TypeOK
    IdsSuffice
    GoalA
    GoalB
    GoalC
    GoalD
    GoalE

PROPERTIES
    GoalF
    GoalG
    GoalH
