\* Must fail: GraphEventuallySynced. With weak rather than strong fairness
\* on Complete, a peer may fail every attempt forever, since each failure
\* disables Complete until the next attempt.

SPECIFICATION SpecWeakCompletion

CONSTANTS
    Peers = {1, 2}
    MaxSessions = 3
    MaxQuota = 2
    Faults = TRUE
    NoSettle = FALSE
    NoPinnedRetry = FALSE
    NoLocalBackoff = FALSE

PROPERTIES
    GraphEventuallySynced
