\* Green. A slow, lossy honest peer under assumption A-DRAIN: it may stop
\* answering, and may pause past the timeout at most once per stream. Every
\* pairing property holds, and every attempt ends.

SPECIFICATION Spec

CONSTANTS
    NumBlocks = 4
    MaxAttempts = 3
    MaxBatches = 2
    MaxReplies = 4
    MaxPauses = 1
    Stalls = TRUE
    MaxDups = 0
    MaxCorrupts = 0
    Format = "lnd"
    CompleteEveryReply = FALSE
    NoDraining = FALSE
    NoFirstReplyCheck = FALSE
    LegacyDrainOnLastBlock = FALSE
    FixedDrainDeadline = FALSE

INVARIANTS
    TypeOK
    NoCrossAttemptCredit
    WholeStreamCredit
    OneOutstandingQuery
    AtMostOneOutcome
    QuiescentIdle

PROPERTIES
    EveryAttemptEnds

\* Every behavior of the world is finite, so its last state has no
\* successor. That is the end of the run, not a deadlock.
CHECK_DEADLOCK FALSE
