\* Green. A byzantine peer that may also duplicate one reply and corrupt
\* one, with a reply budget of three. Pairing is out of contract for such a
\* peer (open question Q7), but every attempt still ends with exactly one
\* outcome and the syncer returns to Idle. As in SyncerVerySlow, the
\* liveness property is left out for its cost.

SPECIFICATION Spec

CONSTANTS
    NumBlocks = 4
    MaxAttempts = 3
    MaxBatches = 2
    MaxReplies = 3
    MaxPauses = 1
    Stalls = TRUE
    MaxDups = 1
    MaxCorrupts = 1
    Format = "lnd"
    CompleteEveryReply = FALSE
    NoDraining = FALSE
    NoFirstReplyCheck = FALSE
    LegacyDrainOnLastBlock = FALSE
    FixedDrainDeadline = FALSE

INVARIANTS
    TypeOK
    AtMostOneOutcome
    QuiescentIdle


\* Every behavior of the world is finite, so its last state has no
\* successor. That is the end of the run, not a deadlock.
CHECK_DEADLOCK FALSE
