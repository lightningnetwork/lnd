\* Must fail: NoCrossAttemptCredit. Under the old legacy drain rule,
\* Draining ends on the first reply that covers the last block, which for a
\* legacy peer is the first reply, and the rest of the stream reaches the
\* next attempt.

SPECIFICATION Spec

CONSTANTS
    NumBlocks = 4
    MaxAttempts = 3
    MaxBatches = 2
    MaxReplies = 4
    MaxPauses = 1
    Stalls = TRUE
    MaxDups = 0
    MaxCorrupts = 0
    Format = "legacy"
    CompleteEveryReply = FALSE
    NoDraining = FALSE
    NoFirstReplyCheck = FALSE
    LegacyDrainOnLastBlock = TRUE
    FixedDrainDeadline = FALSE

INVARIANTS
    NoCrossAttemptCredit

\* Every behavior of the world is finite, so its last state has no
\* successor. That is the end of the run, not a deadlock.
CHECK_DEADLOCK FALSE
