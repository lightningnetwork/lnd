\* Must fail: WholeStreamCredit. Without the first-reply check, the tail of
\* an earlier stream completes a new attempt once two long pauses have
\* outlasted both timers.

SPECIFICATION Spec

CONSTANTS
    NumBlocks = 4
    MaxAttempts = 3
    MaxBatches = 2
    MaxReplies = 4
    MaxPauses = 2
    Stalls = TRUE
    MaxDups = 0
    MaxCorrupts = 0
    Format = "lnd"
    CompleteEveryReply = FALSE
    NoDraining = FALSE
    NoFirstReplyCheck = TRUE
    LegacyDrainOnLastBlock = FALSE
    FixedDrainDeadline = FALSE

INVARIANTS
    WholeStreamCredit

\* Every behavior of the world is finite, so its last state has no
\* successor. That is the end of the run, not a deadlock.
CHECK_DEADLOCK FALSE
