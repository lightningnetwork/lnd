\* Must fail, a finding: OneOutstandingQuery. The production syncer with a
\* prompt honest peer whose stream is longer than the reply budget of
\* three. The budget ends the range phase with the rest of the stream still
\* on the link, and the next attempt queries while it arrives. Every pairing
\* property in the other cases assumes streams fit in the budget, as GSS-007
\* already states; with Go's budget of 500 replies that holds for any
\* realistic graph.

SPECIFICATION Spec

CONSTANTS
    NumBlocks = 4
    MaxAttempts = 3
    MaxBatches = 2
    MaxReplies = 3
    MaxPauses = 0
    Stalls = FALSE
    MaxDups = 0
    MaxCorrupts = 0
    Format = "lnd"
    CompleteEveryReply = FALSE
    NoDraining = FALSE
    NoFirstReplyCheck = FALSE
    LegacyDrainOnLastBlock = FALSE
    FixedDrainDeadline = FALSE

INVARIANTS
    OneOutstandingQuery

\* Every behavior of the world is finite, so its last state has no
\* successor. That is the end of the run, not a deadlock.
CHECK_DEADLOCK FALSE
