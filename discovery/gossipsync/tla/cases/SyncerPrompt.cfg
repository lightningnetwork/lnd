\* Green. A prompt honest peer, which never pauses past the timeout and
\* never stalls: every property holds, and no attempt fails with a peer fault.

SPECIFICATION Spec

CONSTANTS
    NumBlocks = 4
    MaxAttempts = 3
    MaxBatches = 2
    MaxReplies = 4
    MaxPauses = 0
    Stalls = FALSE
    MaxDups = 0
    MaxCorrupts = 0
    Format = "lnd"
    CompleteEveryReply = FALSE
    NoDraining = FALSE
    NoFirstReplyCheck = FALSE
    LegacyDrainOnLastBlock = FALSE
    FixedDrainDeadline = FALSE

INVARIANTS
    TypeOK
    NoCrossAttemptCredit
    WholeStreamCredit
    OneOutstandingQuery
    AtMostOneOutcome
    QuiescentIdle
    PromptPeerNeverFaulted

PROPERTIES
    EveryAttemptEnds

\* Every behavior of the world is finite, so its last state has no
\* successor. That is the end of the run, not a deadlock.
CHECK_DEADLOCK FALSE
