\* Green. A peer slower than A-DRAIN allows, with up to six long pauses per
\* stream. The state space stops growing at six, so at this scope that is
\* any number of pauses. Replies may be credited to the wrong attempt, but
\* only as a whole stream, and every attempt still ends with exactly one
\* outcome. The liveness property is left to the honest cases, since it
\* costs twenty times the invariants here, and QuiescentIdle already says
\* every attempt has ended once the world has nothing left to do.

SPECIFICATION Spec

CONSTANTS
    NumBlocks = 4
    MaxAttempts = 3
    MaxBatches = 2
    MaxReplies = 4
    MaxPauses = 6
    Stalls = TRUE
    MaxDups = 0
    MaxCorrupts = 0
    Format = "lnd"
    CompleteEveryReply = FALSE
    NoDraining = FALSE
    NoFirstReplyCheck = FALSE
    LegacyDrainOnLastBlock = FALSE
    FixedDrainDeadline = FALSE

INVARIANTS
    TypeOK
    WholeStreamCredit
    AtMostOneOutcome
    QuiescentIdle


\* Every behavior of the world is finite, so its last state has no
\* successor. That is the end of the run, not a deadlock.
CHECK_DEADLOCK FALSE
