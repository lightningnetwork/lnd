syntax = "proto3";

package switchrpc;

import "lightning.proto";

option go_package = "github.com/lightningnetwork/lnd/lnrpc/switchrpc";

// Switch is a service that offers advanced interaction with the HTLC fowarding
// subsystem of the daemon.
service Switch {
    /*
    SendOnion dispatches a pre-formed onion packet. It is the primary entry
    point for a remote router and is idempotent. A client can and should
    retry it after a timeout or disconnection, reusing the same attempt_id so
    the server recognises the retry rather than sending a second HTLC.

    The outcome is carried in the response, never in a gRPC error. Exactly one
    of Accepted, Rejected or Ambiguous is set, and each documents the action it
    obliges the caller to take. An outcome the client does not recognise, or a
    response with none set, MUST be treated as Ambiguous.

    A gRPC error means the call failed rather than the HTLC. The cause may be
    a malformed request, an auth failure, a transport problem, or a server not
    running this sub-server. The error describes only that call, and an
    earlier call with the same attempt_id may already have dispatched the
    HTLC. After any gRPC error the client MUST NOT conclude that the HTLC was
    not dispatched. It may retry the same attempt_id, or stop and alert, but
    MUST NOT send a replacement under a new attempt_id until this one is
    answered Rejected or TrackOnion reports it failed.

    A malformed request is answered with InvalidArgument and the attempt is
    recorded as failed. Retrying the same attempt_id is still safe, because the
    server answers Accepted and TrackOnion returns the recorded failure. Only
    once the attempt is known to have failed may the client send a corrected
    request under a new attempt_id.
    */
    rpc SendOnion (SendOnionRequest) returns (SendOnionResponse);

    /*
    TrackOnion allows callers to query whether or not a payment dispatched via
    SendOnion succeeded or failed.

    This RPC is designed to be called after a successful dispatch has been
    explicitly confirmed via the SendOnion RPC. It should not be used to
    determine whether an HTLC dispatch was received in an ambiguous network
    scenario. That ambiguity must be resolved by retrying the idempotent
    SendOnion RPC until a definitive acknowledgement is received from the Switch
    RPC server.

    Once dispatch is confirmed, TrackOnion provides the mechanism to wait for
    the result of the in-flight HTLC. A client must handle three distinct
    categories of outcomes:

    1. PAYMENT SUCCESS (gRPC code OK, preimage set): The payment settled
    successfully. The response contains the payment preimage.

    2. PAYMENT FAILURE (gRPC code OK, failure_details set): The payment failed
    at the application level. The failure_details oneof describes the specific
    failure type: a ForwardingFailure from a remote hop, a LocalFailure
    from the local node, an UnreadableFailure if the error could not be
    decoded, or a SwitchError for other switch-level failures. When
    encrypted_error_data is populated, the client may perform its own
    decryption.

    3. QUERY FAILURE (gRPC error status): The query itself could not be
    completed. NotFound indicates the payment ID is unknown. Unavailable
    signals the switch is shutting down. Canceled or DeadlineExceeded
    reflects client-side timeouts. These are safe to retry.
    */
    rpc TrackOnion (TrackOnionRequest) returns (TrackOnionResponse);

    /*
    BuildOnion attempts to build an onion packet for the specified route.
    */
    rpc BuildOnion (BuildOnionRequest) returns (BuildOnionResponse);

    /*
    DeleteAttempts removes terminal (settled or failed) payment attempt records
    from the server's attempt store. The client explicitly names the attempt
    IDs to delete, enabling online garbage collection of completed attempt
    data.

    The server processes each attempt ID independently and reports per-ID
    results. Pending (in-flight) attempts are never deleted; they are reported
    with a DELETION_PENDING status. Unknown attempt IDs are reported with
    DELETION_NOT_FOUND. Unprocessable records are reported with
    DELETION_FAILED. The overall RPC succeeds (gRPC OK) as long as the
    request could be processed, even if individual attempts were not deleted.

    Clients MUST only delete attempts whose outcome (settled or failed) has
    been durably recorded and will never need to be retried. Deleting an
    attempt removes the server's idempotency protection for that attempt ID.
    */
    rpc DeleteAttempts (DeleteAttemptsRequest) returns (DeleteAttemptsResponse);

    /*
    DisableRemoteRouter marks the database as no longer being used by a remote
    router. This is useful for migrating from a remote router setup back to the
    default embedded router. This RPC will fail if there are any attempt entries
    remaining in the network result store.
    */
    rpc DisableRemoteRouter (DisableRemoteRouterRequest)
        returns (DisableRemoteRouterResponse);
}

message SendOnionRequest {
    // The raw onion packet to be sent across the network.
    bytes onion_blob = 1;

    // The attempt ID uniquely identifying this payment attempt. The caller can
    // expect to track results for the payment via this attempt ID.
    uint64 attempt_id = 2;

    // The first hop's public key where the onion will be sent.
    // The first hop must be specified either by channel ID or public key.
    bytes first_hop_pubkey = 3;

    // The channel id of the channel that must be taken to the first hop.
    // The first hop must be specified either by channel ID or public key.
    uint64 first_hop_chan_id = 4;

    // The total amount in millisatoshis required to complete a payment over
    // this route. This value includes the cumulative fees at each hop. The HTLC
    // extended to the first-hop in the route will need to have at least this
    // many (milli)satoshis.
    int64 amount = 5;

    // The absolute timelock or CLTV value that should be extended to the first
    // hop in the route. All other hops will decrement the time-lock as
    // described by the onion.
    uint32 timelock = 6;

    // The payment hash associated with the HTLC. This is needed for tracking
    // and debugging purposes.
    bytes payment_hash = 7;

    // The optional blinding point to use when constructing the HTLC.
    // If set, this will be used to blind the next hop in the route.
    optional bytes blinding_point = 8;

    // Optional custom TLV records to include in the UpdateAddHTLC message.
    map<uint64, bytes> custom_records = 9;

    // Optional opaque extra data to attach to the UpdateAddHTLC message.
    optional bytes extra_data = 10;
}

// SendOnionResponse reports what the switch did with the attempt. Exactly one
// outcome is always set.
//
// A gRPC error from SendOnion means the call itself failed, for example a
// malformed request, an auth failure, a transport problem, or a server not
// running this sub-server. It never describes what happened to an HTLC, which
// an earlier call with the same attempt_id may already have dispatched. After
// any gRPC error the caller MUST NOT conclude that the HTLC was not
// dispatched, and MUST NOT send a replacement under a new attempt_id until
// this one is answered Rejected or TrackOnion reports it failed.
//
// A caller that receives an outcome it does not recognise, or a response with
// no outcome set at all, MUST treat it as Ambiguous and retry the same
// attempt_id. It MUST NOT treat it as success, failure, or an empty response.
// An unhandled gRPC error is loud, while an unhandled response field is
// silent, so a caller built against an older version of this service could
// otherwise misread a newer server's answer as "nothing happened". Treating
// the unknown case as Ambiguous limits the cost of a misread to a wasted retry
// rather than a lost or duplicated payment.
message SendOnionResponse {
    oneof outcome {
        Accepted accepted = 1;
        Rejected rejected = 2;
        Ambiguous ambiguous = 3;
    }
}

// Accepted means the switch has taken ownership of this attempt. Await the
// result with TrackOnion.
//
// Do NOT conclude success or failure from this message. It reports who owns
// the attempt, not how it ended.
message Accepted {
    // Set when the switch already held this attempt from an earlier call,
    // either because the attempt was already registered or because a circuit
    // for it already existed. Required behaviour is identical either way; this
    // is diagnostic.
    //
    // A circuit without a registration should not occur in correct operation.
    // It means the attempt_id is also in use by another dispatcher, such as
    // lnd's own router, so the result later tracked may belong to that
    // dispatcher's HTLC. Keep attempt_ids unique.
    bool already_registered = 1;
}

// Rejected means the switch declined the HTLC before taking ownership of it.
// The HTLC provably never left this node, so no funds are at risk and the
// caller MAY fail this attempt and try another route.
message Rejected {
    // The BOLT #4 wire failure explaining the rejection, including any
    // channel update, as encoded by lnwire.EncodeFailure.
    //
    // This is always present and always decodable. A rejection the switch
    // cannot describe is reported as Ambiguous, because a definite verdict
    // the caller cannot act on is worse than admitting uncertainty. The caller
    // would have nothing to give its router and nothing to penalise with.
    bytes wire_failure = 1;
}

// Ambiguous means the state of the dispatch is unknown. The switch may or may
// not hold the attempt.
//
// The caller MUST retry the same attempt_id until it receives Accepted or
// Rejected, and MUST NOT record a terminal outcome for the attempt in the
// meantime. Retrying is safe because the switch recognises an attempt it
// already holds and answers Accepted rather than dispatching a second HTLC.
message Ambiguous {
    // A human-readable reason that can be used for logging and metrics.
    //
    // Behaviour MUST NOT branch on this value. Every ambiguous outcome
    // requires the same action, and a caller that treats one reason
    // differently from another will eventually treat one of them unsafely.
    // It is free text rather than an enum for exactly that reason.
    string reason = 1;
}

message TrackOnionRequest {
    // The payment hash associated with the HTLC. This is needed for tracking
    // and debugging purposes.
    bytes payment_hash = 1;

    // The attempt ID uniquely identifying this payment attempt. The caller can
    // expect to track results for the payment via this attempt ID.
    uint64 attempt_id = 2;

    // Optional: The session key that was used to construct the onion packet.
    // This is required by the server to decrypt any failure message.
    optional bytes session_key = 3;

    // Optional: The public keys of the nodes in the route, used with the
    // session_key to decrypt any failure message.
    repeated bytes hop_pubkeys = 4;
}

message TrackOnionResponse {
    // The final result of the payment attempt, which is either a preimage
    // (success) or detailed failure information.
    oneof result {
        // The preimage obtained by making the payment. If this field is set,
        // the payment succeeded.
        bytes preimage = 1;

        // The application-level failure for the payment attempt. If this field
        // is set, the payment attempt failed.
        FailureDetails failure_details = 2;
    }
}

// FailureDetails provides structured information about why a payment attempt
// failed on the network. This message is included in a successful
// TrackOnionResponse when the queried attempt ultimately failed.
message FailureDetails {
    // A human-readable error_message for logging or display.
    string error_message = 1;

    // The failure contains specific, structured details about the error.
    // Exactly one variant is set when this message is present.
    oneof failure {
        // local_failure is set when the failure originates at the local
        // node (e.g. unable to forward due to insufficient balance,
        // channel policy violations, or other link-level rejections). The
        // wire message is available in plaintext without onion decryption.
        LocalFailure local_failure = 2;

        // forwarding_failure is set when the HTLC was forwarded into the
        // network and a remote node returned an error. The onion error
        // was successfully decrypted, yielding the failure source index.
        // The wire_message may be empty if the inner failure could not
        // be decoded.
        ForwardingFailure forwarding_failure = 3;

        // encrypted_error_data contains the raw onion-encrypted error
        // blob. This is returned when no decryption keys were provided
        // in the TrackOnionRequest (i.e. no session key or hop public
        // keys), deferring decryption entirely to the client.
        bytes encrypted_error_data = 4;

        // unreadable_failure indicates that decryption keys were provided
        // and decryption was attempted, but failed. The original error
        // cannot be recovered.
        UnreadableFailure unreadable_failure = 5;

        // switch_error indicates an unexpected internal error that does
        // not fall into any of the above categories.
        SwitchError switch_error = 6;
    }
}

// ForwardingFailure represents an HTLC failure that occurred at a remote node
// in the payment route. The onion error was successfully decrypted, revealing
// the failing hop.
message ForwardingFailure {
    // failure_source_index is the 0-based index of the node within the payment
    // route that reported the failure. Index 0 refers to the local node.
    uint32 failure_source_index = 1;

    // The raw, serialized lnwire.FailureMessage reported by the failing node.
    // This field may be empty if the failure message could not be decoded.
    bytes wire_message = 2;
}

// LocalFailure represents a failure that originates at the local node. No
// onion decryption is involved because the failure occurred before the HTLC
// left our node.
message LocalFailure {
    // The raw, serialized `lnwire.FailureMessage`.
    bytes wire_message = 1;
}

// SwitchError indicates that an error occurred within the switch subsystem.
message SwitchError {
}

// UnreadableFailure indicates that decryption keys were provided and
// decryption was attempted, but failed. The original failure information
// cannot be recovered.
message UnreadableFailure {
}

// BuildOnionRequest includes the necessary information to construct a Sphinx
// onion packet.
message BuildOnionRequest {
    // The route for which the onion packet should be built.
    lnrpc.Route route = 1;

    // The payment hash associated with the HTLC.
    bytes payment_hash = 2;

    // A session key for onion packet construction, if not provided, a new one
    // will be generated.
    optional bytes session_key = 3;
}

// BuildOnionResponse contains the constructed onion packet.
message BuildOnionResponse {
    // The constructed onion packet in bytes.
    bytes onion_blob = 1;

    // The session key used for building the onion packet.
    bytes session_key = 2;

    // The serialized public keys of all nodes along the route for the
    // constructed onion.
    repeated bytes hop_pubkeys = 3;
}

message DeleteAttemptsRequest {
    // The attempt IDs to delete from the server's attempt store. Only terminal
    // (settled or failed) attempts will be deleted. Pending (in-flight)
    // attempts are skipped and reported with a DELETION_PENDING status.
    repeated uint64 attempt_ids = 1;
}

message DeleteAttemptsResponse {
    // Per-attempt deletion outcomes. The order corresponds to the order of
    // attempt_ids in the request.
    repeated AttemptDeletionResult results = 1;
}

// AttemptDeletionResult reports the outcome of deleting a single attempt.
message AttemptDeletionResult {
    // The attempt ID this result corresponds to.
    uint64 attempt_id = 1;

    // The outcome of the deletion for this attempt.
    AttemptDeletionStatus status = 2;
}

// AttemptDeletionStatus describes the outcome of a single attempt deletion.
enum AttemptDeletionStatus {
    // The attempt result was successfully deleted from the store.
    DELETION_OK = 0;

    // The attempt is still in-flight (pending) and cannot be safely deleted.
    DELETION_PENDING = 1;

    // The attempt ID was not found in the store. This may indicate a client
    // bug (wrong ID, wrong backend) since the server has no record of this
    // attempt ever existing.
    DELETION_NOT_FOUND = 2;

    // The attempt record exists but could not be processed (e.g.
    // deserialization error). The record remains in the store.
    DELETION_FAILED = 3;
}

message DisableRemoteRouterRequest {
}

message DisableRemoteRouterResponse {
}
